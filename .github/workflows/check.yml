name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - uses: golangci/golangci-lint-action@v6
        with:
          install-mode: binary
          args: --version

      - name: shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: make check
        run: make check
