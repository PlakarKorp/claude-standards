name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      # The hook shells out to golangci-lint, so tests/run.sh needs the binary
      # on PATH. Not golangci-lint-action: that one runs the linter over the
      # repository, and there is no Go code here to lint.
      - name: install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1
          echo "$(go env GOPATH)/bin" >>"$GITHUB_PATH"

      - name: versions
        run: |
          go version
          golangci-lint --version
          shellcheck --version

      - name: make check
        run: make check
